version: "3"

dotenv:
  - .env
  - core/.env

tasks:
  fmt:api:
    dir: ./api
    cmd: go fmt ./...
  fmt:web:
    dir: ./web
    cmd: pnpm format
  fmt:
    deps:
      - fmt:api
      - fmt:web
  lgtm:
    cmd: |
      docker run --name lgtm -p 3000:3000 -p 4317:4317 -p 4318:4318 --rm -ti \
      -v "$PWD"/lgtm/grafana:/data/grafana \
      -v "$PWD"/lgtm/prometheus:/data/prometheus \
      -v "$PWD"/lgtm/loki:/data/loki \
      -e GF_PATHS_DATA=/data/grafana \
      docker.io/grafana/otel-lgtm:0.8.1
  jaeger:
    cmd: |
      docker run --rm \
      -e COLLECTOR_ZIPKIN_HOST_PORT=:9411 \
      -p 16686:16686 \
      -p 4317:4317 \
      -p 4318:4318 \
      -p 9411:9411 \
      jaegertracing/all-in-one:latest
  dev:api:
    dir: ./api
    cmds:
      - go run ./cmd/incidentbuddy/main.go
  dev:web:
    dir: ./web
    cmd: pnpm dev
  dev:
    deps:
      - dev:api
      - dev:web
  clean:proto:
    cmds:
      - rm -rf ../api/gen
      - rm -rf ../web/gen
  gen:proto:
    deps:
      - clean:proto
    dir: ./proto
    cmds:
      - buf lint
      - buf generate
  ngrok:
    cmd: ngrok http 8001
  dev:slack:
    dir: ./slack
    cmd: deno run -A ./src/main.ts
  db:migrate:
    dir: ./db
    cmd: PGPASSWORD=$DB_PASS psqldef -h $DB_HOST -U $DB_USER $DB_NAME --enable-drop-table < schema.sql
