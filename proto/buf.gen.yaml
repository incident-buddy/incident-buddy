version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: ../api/gen/pb
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../api/gen/pb
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.5
    out: ../web/gen/pb
    include_imports: true
    opt: target=ts
  - remote: buf.build/connectrpc/query-es:v2.0.1
    out: ../web/gen/pb
    include_imports: true
    opt: target=ts