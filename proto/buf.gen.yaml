version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/incident-buddy/api/gen/proto
plugins:
  - local: protoc-gen-go
    out: ../api/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../api/gen/proto
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.5
    out: ../web/gen/proto
    include_imports: true
    opt: target=ts
  - remote: buf.build/connectrpc/query-es:v2.0.1
    out: ../web/gen/proto
    include_imports: true
    opt: target=ts