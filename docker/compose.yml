services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: incidentbuddy
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d incidentbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: