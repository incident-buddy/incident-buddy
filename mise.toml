[tools]
node = "lts"
pnpm = "latest"

# ── devcontainer ──────────────────────────────────────────────
[tasks."dc:up"]
description = "devcontainer をビルド・起動する"
run = "devcontainer up --workspace-folder ."

[tasks."dc:shell"]
description = "devcontainer のシェルに入る"
run = "devcontainer exec --workspace-folder . bash"

[tasks."dc:stop"]
description = "devcontainer を停止する"
run = "docker stop $(docker ps -qf 'name=vsc-incident-buddy')"

# ── 開発サーバー ──────────────────────────────────────────────
[tasks."dev:firestore"]
description = "Firestore エミュレータを起動する"
run = """
if [ -f /.dockerenv ]; then
  docker compose -f docker/compose.yml up
else
  devcontainer exec --workspace-folder . bash -c 'docker compose -f docker/compose.yml up'
fi
"""

[tasks."dev:api"]
description = "API サーバーを起動する (hot reload)"
run = """
if [ -f /.dockerenv ]; then
  pnpm -F api dev
else
  devcontainer exec --workspace-folder . bash -c 'pnpm -F api dev'
fi
"""

[tasks."dev:ngrok"]
description = "ngrok トンネルを起動する (PORT=8888)"
run = "ngrok http 8888"

# ── コード品質 ─────────────────────────────────────────────────
[tasks.lint]
description = "Biome で lint チェック"
run = """
if [ -f /.dockerenv ]; then
  pnpm lint
else
  devcontainer exec --workspace-folder . bash -c 'pnpm lint'
fi
"""

[tasks."lint:fix"]
description = "Biome で lint 自動修正"
run = """
if [ -f /.dockerenv ]; then
  pnpm lint:fix
else
  devcontainer exec --workspace-folder . bash -c 'pnpm lint:fix'
fi
"""

[tasks.typecheck]
description = "TypeScript 型チェック"
run = """
if [ -f /.dockerenv ]; then
  pnpm typecheck
else
  devcontainer exec --workspace-folder . bash -c 'pnpm typecheck'
fi
"""

# ── テスト ────────────────────────────────────────────────────
[tasks."test:unit"]
description = "ユニットテストを実行する (Firestoreエミュレータ不要)"
run = """
if [ -f /.dockerenv ]; then
  pnpm -F api exec vitest run --config vitest.unit.config.ts
else
  devcontainer exec --workspace-folder . bash -c 'pnpm -F api exec vitest run --config vitest.unit.config.ts'
fi
"""

[tasks.test]
description = "全テストを実行する (Firestoreエミュレータ必須)"
run = """
if [ -f /.dockerenv ]; then
  pnpm -F api test
else
  devcontainer exec --workspace-folder . bash -c 'pnpm -F api test'
fi
"""

# ── 動作確認 ──────────────────────────────────────────────────
[tasks.health]
description = "API サーバーのヘルスチェック"
run = "curl -s http://localhost:8888/health | jq ."
