version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: incident-buddy/internal/gen
plugins:
  - local: protoc-gen-go
    out: ../core/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../core/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-es
    out: ../web/gen
    include_imports: true
    # Add more plugin options here
    opt: target=ts