[tools]
node = "lts"
pnpm = "latest"


# ── 開発サーバー ──────────────────────────────────────────────
[tasks."dev:firestore"]
description = "Firestore エミュレータを起動する"
run = """
if [ -f /.dockerenv ]; then
  docker compose -f docker/compose.yml up
else
  devcontainer exec --workspace-folder . bash -c 'docker compose -f docker/compose.yml up'
fi
"""

[tasks."dev:api"]
description = "API サーバーを起動する (hot reload)"
run = "pnpm -F api dev"

[tasks."dev:ngrok"]
description = "ngrok トンネルを起動する (PORT=8888)"
run = "ngrok http 8888"

# ── コード品質 ─────────────────────────────────────────────────
[tasks.lint]
description = "Biome で lint チェック"
run = "pnpm lint"

[tasks."lint:fix"]
description = "Biome で lint 自動修正"
run = "pnpm lint:fix"

[tasks.typecheck]
description = "TypeScript 型チェック"
run = "pnpm typecheck"

# ── テスト ────────────────────────────────────────────────────
[tasks."test:unit"]
description = "ユニットテストを実行する"
run = "pnpm -F api exec vitest run --config vitest.unit.config.ts"

[tasks.test]
description = "全テストを実行する (Firestoreエミュレータ必須)"
run = "pnpm -F api test"

# ── 動作確認 ──────────────────────────────────────────────────
[tasks.health]
description = "API サーバーのヘルスチェック"
run = "curl -s http://localhost:8888/health | jq ."
