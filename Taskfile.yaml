version: "3"

dotenv:
  - .env
  - core/.env

tasks:
  fmt:core:
    dir: ./core
    cmd: pnpm format
  fmt:web:
    dir: ./tenant-web
    cmd: pnpm format
  fmt:
    deps:
      - fmt:core
      - fmt:web
  dev:web:
    dir: ./web
    cmd: pnpm dev
  dev:
    deps:
      - dev:web
  clean:proto:
    cmds:
      - rm -rf ./core/gen/pb
      - rm -rf ./web/gen/pb
  gen:proto:
    deps:
      - clean:proto
    dir: ./proto
    cmds:
      - pnpm run buf:lint
      - pnpm run buf:gen
  gen:schema:
    dir: ./core
    cmd: pnpm run gen:schema
  dev:slack:
    dir: ./slack
    cmd: deno run -A ./src/main.ts

  db:
    cmd: docker run --rm -it -e PGPASSWORD=$DB_PASS --net=host postgres:16 psql -p 5432 -h $DB_HOST -U $DB_USER $DB_NAME
  db:clean:
    dir: ./db
    cmd: docker run --rm -it -e PGPASSWORD=$DB_PASS --net=host postgres:16 psql -p 5432 -h $DB_HOST -U $DB_USER $DB_NAME -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
  db:migrate:
    dir: ./db
    cmd: PGPASSWORD=$DB_PASS psqldef -p 5432 -h $DB_HOST -U $DB_USER $DB_NAME --enable-drop-table < schema.sql

  db:reset:
    dir: ./db
    cmds:
      - task db:clean
      - task db:migrate
      - docker run --rm -it -e PGPASSWORD=$DB_PASS --net=host -v ./:/db postgres psql -p 5432 -h $DB_HOST -U $DB_USER $DB_NAME  -f /db/seed.sql

  ngrok:
    cmd: ngrok http 8001
