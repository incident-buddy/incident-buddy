services:
  firestore:
    build:
      context: ..
      dockerfile: docker/Dockerfile.emulator
    command: >
      firebase emulators:start --only firestore
      --project=demo-incident-buddy
    ports:
      - "4004:4000"
      - "9080:9080"
    networks:
      - incident-buddy

networks:
  incident-buddy:
    name: incident-buddy
