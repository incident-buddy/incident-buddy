version: '3'

dotenv:
  - .env
  - core/.env

tasks:
  setup:
    cmds:
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
  run:core:
    dir: ./core
    cmd: go run ./main.go
  gen:connect:
    dir: ./web
    cmd: pnpm gen
    silent: true
  gen:sqlc:
    dir: .
    cmd: sqlc generate
  gen:
    deps:
      - gen:connect
      - gen:sqlc
  db:migrate:
    dir: ./db
    cmd: PGPASSWORD=$DB_PASS psqldef -h $DB_HOST -U $DB_USER $DB_NAME --enable-drop-table < schema.sql