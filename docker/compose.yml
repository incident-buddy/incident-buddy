services:
  firestore:
    build:
      context: ..
      dockerfile: docker/Dockerfile.emulator
    command: >
      firebase emulators:start --only firestore
      --project=demo-incident-buddy
    ports:
      - "4004:4000"
      - "9080:9080"
    networks:
      - incident-buddy

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
    networks:
      - incident-buddy

networks:
  incident-buddy:
    name: incident-buddy
