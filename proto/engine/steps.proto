syntax = "proto3";

package engine;

option go_package = "incidentbuddy.engine;engine";

message Steps {
  repeated Step steps = 1;
}

message Step {
  string code = 1;
  oneof stepParams {
    SlackPostParams slack_post_params = 2;
    SmsSendParams sms_send_params = 3;
  }
}

message SlackPostParams {
  string channel = 1;
  string message = 2;
}

message SmsSendParams {
  string phone_number = 1;
  string message = 2;
}