version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: incident-buddy/core/gen/proto
plugins:
  - local: protoc-gen-go
    out: ../core/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../core/gen/proto
    opt: paths=source_relative
  - local: protoc-gen-es
    out: ../web/gen/proto
    include_imports: true
    opt: target=ts